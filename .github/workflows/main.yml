name: Daily Contribution

on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update contribution file
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > daily.txt

      - name: Commit and push
        run: |
          git config user.name "Yukako-Nko"
          git config user.email "257514304+Yukako-Nko@users.noreply.github.com"
          git add daily.txt
          git commit -m "Daily contribution"
          git push
